name: Reportar problema
description: Descreva uma falha reproduzível, sem dados privados.
body:
  - type: markdown
    attributes:
      value: "Não cole .env, tokens, URLs assinadas ou endpoints push. Para vulnerabilidades, consulte SECURITY.md."
  - type: textarea
    id: observed
    attributes:
      label: O que aconteceu?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que você esperava?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir?
  - type: input
    id: environment
    attributes:
      label: Ambiente
      placeholder: Python, sistema e navegador; sem identificadores de conta.
