name: Testes do Radar IA
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar projeto e dependências de teste
        run: python -m pip install -e ".[test]"
      - name: Testes Python sem serviços pagos
        run: python -m pytest -q
      - name: Testes do login no navegador (simulados)
        run: node --test tests/web/auth.test.cjs
      - name: Validar sintaxe da interface
        run: |
          node --check src/radar_ia/web/app.js
          node --check src/radar_ia/web/auth.js
