[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-ia"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["boto3[crt]>=1.42,<2", "feedparser>=6.0.11,<7", "httpx>=0.28,<1", "openai>=2,<3", "python-dotenv>=1,<2", "tzdata>=2025.1", "pydantic>=2.10,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
radar-ia = "radar_ia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-data]
radar_ia = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg", "web/*.webmanifest"]
