<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000" role="img">
<title>Radar IA — arquitetura e fluxo do MVP privado</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#BBA3FF"/></marker></defs>
<rect width="1600" height="2000" fill="#161428"/>
<g font-family="Segoe UI, Arial, sans-serif">
<rect x="80" y="72" width="76" height="8" rx="4" fill="#BBA3FF" stroke="none" stroke-width="2"/>
<text x="80" y="137" fill="#BBA3FF" font-size="23" font-weight="700" letter-spacing="2">RADAR IA  /  MÓDULOS E RESPONSABILIDADES</text>
<text x="80" y="245" fill="#F6F3FF" font-size="79" font-weight="700" letter-spacing="0">Agentes com limites claros.</text>
<text x="80" y="309" fill="#BFB8D4" font-size="31" font-weight="400" letter-spacing="0">Automação modular + geração com LLM + serviços AWS.</text>
<rect x="80" y="364" width="1440" height="118" rx="24" fill="#26213E" stroke="#53446E" stroke-width="2"/>
<text x="112" y="413" fill="#BBA3FF" font-size="26" font-weight="700" letter-spacing="0">ORQUESTRAÇÃO EM PYTHON</text>
<text x="112" y="454" fill="#F6F3FF" font-size="27" font-weight="400" letter-spacing="0">production.py + Lambda + EventBridge Scheduler • checkpoints S3 • IAM por função</text>
<rect x="80" y="550" width="680" height="280" rx="24" fill="#26213E" stroke="#51446B" stroke-width="2"/>
<text x="104" y="582" fill="#BBA3FF" font-size="19" font-weight="700" letter-spacing="1">CÓDIGO PYTHON</text>
<text x="104" y="627" fill="#F6F3FF" font-size="37" font-weight="650" letter-spacing="0">01  Coletor RSS</text>
<text x="104" y="667" fill="#BFB8D4" font-size="24" font-weight="400" letter-spacing="0">collection.py • httpx • feedparser</text>
<text x="104" y="699" fill="#BFB8D4" font-size="24" font-weight="400" letter-spacing="0">Datas, URLs e domínios permitidos</text>
<text x="104" y="731" fill="#BFB8D4" font-size="24" font-weight="400" letter-spacing="0">Resumos e referências preservados</text>
<rect x="840" y="550" width="680" height="280" rx="24" fill="#26213E" stroke="#51446B" stroke-width="2"/>
<text x="864" y="582" fill="#BBA3FF" font-size="19" font-weight="700" letter-spacing="1">AGENTE LLM</text>
<text x="864" y="627" fill="#F6F3FF" font-size="37" font-weight="650" letter-spacing="0">02  Relevância</text>
<text x="864" y="667" fill="#BFB8D4" font-size="24" font-weight="400" letter-spacing="0">RelevanceAgent • OpenRouter</text>
<text x="864" y="699" fill="#BFB8D4" font-size="24" font-weight="400" letter-spacing="0">Nota de 0 a 5 + justificativa por ID</text>
<text x="864" y="731" fill="#BFB8D4" font-size="24" font-weight="400" letter-spacing="0">Seleciona candidatas com nota mínima 3</text>
<rect x="840" y="950" width="680" height="280" rx="24" fill="#26213E" stroke="#51446B" stroke-width="2"/>
<text x="864" y="982" fill="#BBA3FF" font-size="19" font-weight="700" letter-spacing="1">GERAÇÃO COM LLM</text>
<text x="864" y="1027" fill="#F6F3FF" font-size="37" font-weight="650" letter-spacing="0">03  Roteirista</text>
<text x="864" y="1067" fill="#BFB8D4" font-size="24" font-weight="400" letter-spacing="0">script.py • OpenRouter • Gemini</text>
<text x="864" y="1099" fill="#BFB8D4" font-size="24" font-weight="400" letter-spacing="0">JSON estruturado + validação Pydantic</text>
<text x="864" y="1131" fill="#BFB8D4" font-size="24" font-weight="400" letter-spacing="0">Português e glossário técnico em inglês</text>
<rect x="80" y="950" width="680" height="280" rx="24" fill="#26213E" stroke="#51446B" stroke-width="2"/>
<text x="104" y="982" fill="#BBA3FF" font-size="19" font-weight="700" letter-spacing="1">AGENTE LLM</text>
<text x="104" y="1027" fill="#F6F3FF" font-size="37" font-weight="650" letter-spacing="0">04  Avaliador</text>
<text x="104" y="1067" fill="#BFB8D4" font-size="24" font-weight="400" letter-spacing="0">ScriptReviewerAgent • OpenRouter</text>
<text x="104" y="1099" fill="#BFB8D4" font-size="24" font-weight="400" letter-spacing="0">Fidelidade às evidências e clareza</text>
<text x="104" y="1131" fill="#BFB8D4" font-size="24" font-weight="400" letter-spacing="0">Aprovação vinculada ao hash do roteiro</text>
<rect x="80" y="1350" width="680" height="280" rx="24" fill="#26213E" stroke="#51446B" stroke-width="2"/>
<text x="104" y="1382" fill="#BBA3FF" font-size="19" font-weight="700" letter-spacing="1">POLLY + PUBLICAÇÃO DETERMINÍSTICA</text>
<text x="104" y="1427" fill="#F6F3FF" font-size="37" font-weight="650" letter-spacing="0">05  Produtor</text>
<text x="104" y="1467" fill="#BFB8D4" font-size="24" font-weight="400" letter-spacing="0">Leo • SSML • WAV de até 10 minutos</text>
<text x="104" y="1499" fill="#BFB8D4" font-size="24" font-weight="400" letter-spacing="0">S3 privado + catálogo idempotente</text>
<text x="104" y="1531" fill="#BFB8D4" font-size="24" font-weight="400" letter-spacing="0">Só publica após aprovação editorial</text>
<rect x="840" y="1350" width="680" height="280" rx="24" fill="#26213E" stroke="#51446B" stroke-width="2"/>
<text x="864" y="1382" fill="#BBA3FF" font-size="19" font-weight="700" letter-spacing="1">APLICATIVO WEB</text>
<text x="864" y="1427" fill="#F6F3FF" font-size="37" font-weight="650" letter-spacing="0">06  Player privado</text>
<text x="864" y="1467" fill="#BFB8D4" font-size="24" font-weight="400" letter-spacing="0">CloudFront • Cognito • API Gateway</text>
<text x="864" y="1499" fill="#BFB8D4" font-size="24" font-weight="400" letter-spacing="0">Lambda • S3 • DynamoDB • Web Push</text>
<text x="864" y="1531" fill="#BFB8D4" font-size="24" font-weight="400" letter-spacing="0">Ouvidos, pendentes e posição de escuta</text>
<path d="M 776 690 H 824" fill="none" stroke="#BBA3FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1180 846 V 934" fill="none" stroke="#BBA3FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 824 1090 H 776" fill="none" stroke="#BBA3FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 420 1246 V 1334" fill="none" stroke="#BBA3FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 776 1490 H 824" fill="none" stroke="#BBA3FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="80" y="881" fill="#BFB8D4" font-size="27" font-weight="400" letter-spacing="0">Coleta determinística; relevância, roteiro e avaliação usam LLM.</text>
<text x="560" y="1280" fill="#BFB8D4" font-size="27" font-weight="400" letter-spacing="0">Reprovação → roteirista • na 2ª, revisão humana.</text>
<rect x="80" y="1690" width="1440" height="136" rx="24" fill="#30264B" stroke="none" stroke-width="2"/>
<text x="112" y="1736" fill="#BBA3FF" font-size="27" font-weight="700" letter-spacing="0">OPEN SOURCE EM PREPARAÇÃO • MIT</text>
<text x="112" y="1778" fill="#F6F3FF" font-size="26" font-weight="400" letter-spacing="0">Hoje: aplicativo privado. Evolução: feed RSS público e abertura do código.</text>
<path d="M 80 1880 H 1520" fill="none" stroke="#BFB8D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="80" y="1932" fill="#F6F3FF" font-size="28" font-weight="650" letter-spacing="0">Feito por jrsantosdev</text>
<text x="80" y="1970" fill="#BFB8D4" font-size="23" font-weight="400" letter-spacing="0">MVP privado • código sob licença MIT • abertura pública planejada</text>
<text x="1375" y="1932" fill="#BFB8D4" font-size="24" font-weight="400" letter-spacing="0">03 / 03</text>
</g></svg>
