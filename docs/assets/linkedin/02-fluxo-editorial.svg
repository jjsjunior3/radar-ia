<text x="250" y="471" fill="#117E74" font-size="19" font-weight="700" letter-spacing="1.5">COLETA</text>
<text x="250" y="515" fill="#102B2B" font-size="35" font-weight="700" letter-spacing="0">Encontrar e validar</text>
<text x="250" y="559" fill="#526561" font-size="25" font-weight="400" letter-spacing="0">RSS, datas de publicação e URLs HTTPS.</text>
<text x="950" y="473" fill="#526561" font-size="21" font-weight="500" letter-spacing="0">httpx • feedparser</text>
