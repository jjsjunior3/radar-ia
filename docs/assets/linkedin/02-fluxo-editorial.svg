<text x="250" y="859" fill="#102B2B" font-size="35" font-weight="700" letter-spacing="0">Explicar em português</text>
<text x="250" y="903" fill="#526561" font-size="25" font-weight="400" letter-spacing="0">Inglês técnico contextualizado e saída validada.</text>
<text x="950" y="817" fill="#526561" font-size="21" font-weight="500" letter-spacing="0">OpenRouter • Gemini • Pydantic</text>
