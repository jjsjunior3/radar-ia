<text x="250" y="1075" fill="#526561" font-size="25" font-weight="400" letter-spacing="0">Revisar o roteiro antes de autorizar a voz.</text>
<text x="950" y="989" fill="#526561" font-size="21" font-weight="500" letter-spacing="0">Aprovação vinculada ao texto</text>
