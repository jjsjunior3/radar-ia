<text x="250" y="1331" fill="#8D491D" font-size="19" font-weight="700" letter-spacing="1.5">ESCUTA HUMANA</text>
<text x="250" y="1375" fill="#102B2B" font-size="35" font-weight="700" letter-spacing="0">Ouvir antes de publicar</text>
<text x="250" y="1419" fill="#526561" font-size="25" font-weight="400" letter-spacing="0">Aprovar o áudio que será enviado ao catálogo.</text>
<text x="950" y="1333" fill="#526561" font-size="21" font-weight="500" letter-spacing="0">Aprovação vinculada ao áudio</text>
<rect x="101" y="1517" width="84" height="84" rx="42" fill="#117E74" stroke="none" stroke-width="2"/>
