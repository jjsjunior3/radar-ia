<text x="250" y="643" fill="#117E74" font-size="19" font-weight="700" letter-spacing="1.5">CURADORIA</text>
<text x="250" y="687" fill="#102B2B" font-size="35" font-weight="700" letter-spacing="0">Selecionar o que importa</text>
<text x="250" y="731" fill="#526561" font-size="25" font-weight="400" letter-spacing="0">Grade semanal, deduplicação e quantidade variável.</text>
<text x="950" y="645" fill="#526561" font-size="21" font-weight="500" letter-spacing="0">Python • fila editorial</text>
