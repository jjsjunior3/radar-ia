<text x="250" y="1247" fill="#526561" font-size="25" font-weight="400" letter-spacing="0">Pausas e inglês via SSML; WAV de até 600 segundos.</text>
<text x="950" y="1161" fill="#526561" font-size="21" font-weight="500" letter-spacing="0">Amazon Polly • Leo generativa</text>
<rect x="101" y="1345" width="84" height="84" rx="42" fill="#A65E2B" stroke="none" stroke-width="2"/>
