<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000" role="img">
<title>Radar IA — arquitetura e fluxo do MVP privado</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#117E74"/></marker></defs>
<rect width="1600" height="2000" fill="#F3F5F0"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="80" y="115" fill="#117E74" font-size="24" font-weight="700" letter-spacing="3">RADAR IA  /  DO RSS AO PLAY</text>
<text x="80" y="217" fill="#102B2B" font-size="78" font-weight="750" letter-spacing="0">Notícia boa merece</text>
<text x="80" y="306" fill="#102B2B" font-size="78" font-weight="750" letter-spacing="0">uma escuta melhor.</text>
<text x="80" y="367" fill="#526561" font-size="31" font-weight="400" letter-spacing="0">Um fluxo de IA que você acompanha, revisa e controla.</text>
